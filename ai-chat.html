<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deviwoo - Local AI Chat</title>
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

        body {
            background: linear-gradient(180deg,
                #4a90d9 0%, #6db3f2 20%, #8ecfff 35%,
                #b8e6a8 60%, #7dcf67 80%, #4fb345 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .window { width: 520px; max-height: 85vh; }
        .window-body { display: flex; flex-direction: column; height: 600px; background: rgba(255,255,255,0.95); }

        .chat-area {
            flex: 1; overflow-y: auto; padding: 12px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .msg {
            max-width: 85%; padding: 8px 12px; border-radius: 8px;
            font-size: 0.82rem; line-height: 1.5; word-wrap: break-word;
        }
        .msg.user { align-self: flex-end; background: #e3f2fd; border: 1px solid #bbdefb; }
        .msg.assistant { align-self: flex-start; background: #f5f5f5; border: 1px solid #e0e0e0; }
        .msg.assistant.typing::after { content: '▋'; animation: blink 0.6s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .input-area {
            display: flex; gap: 8px; padding: 10px;
            border-top: 1px solid #ccc; background: #f0f0f0;
        }
        .input-area input {
            flex: 1; padding: 8px 12px; border: 1px solid #ccc;
            border-radius: 4px; font-size: 0.82rem; font-family: inherit;
        }
        .input-area input:focus { outline: none; border-color: #4a90d9; }
        .input-area button { padding: 8px 16px; font-size: 0.78rem; }

        .status-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 12px; font-size: 0.68rem; color: #666;
            border-top: 1px solid #ddd; background: #f5f5f5;
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block; margin-right: 6px;
        }
        .status-dot.loading { background: #f59e0b; animation: pulse 1s infinite; }
        .status-dot.ready { background: #22c55e; }
        .status-dot.error { background: #ef4444; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        .progress { font-size: 0.65rem; color: #888; }

        .model-selector {
            padding: 8px 12px; border-bottom: 1px solid #ddd;
            display: flex; align-items: center; gap: 8px; background: #f8f8f8;
        }
        .model-selector select {
            flex: 1; padding: 4px 8px; font-size: 0.72rem;
            border: 1px solid #ccc; border-radius: 3px; font-family: inherit;
        }
        .model-selector label { font-size: 0.72rem; color: #555; font-weight: 600; }

        .console-log {
            max-height: 80px; overflow-y: auto; padding: 6px 12px;
            font-size: 0.65rem; font-family: monospace; color: #666;
            border-top: 1px solid #ddd; background: #fafafa;
            display: none;
        }
        .console-log.show { display: block; }
    </style>
</head>
<body>

<div class="window active">
    <div class="title-bar">
        <div class="title-bar-text">🤖 Local AI Chat (CPU)</div>
        <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
        </div>
    </div>

    <div class="model-selector">
        <label>Model:</label>
        <select id="modelSelect">
            <option value="qwen35-0.8b-q8">Qwen 3.5 0.8B Q8_0 (~810MB)</option>
            <option value="qwen35-0.8b-q5">Qwen 3.5 0.8B Q5_K_M (~650MB)</option>
            <option value="qwen3-0.6b-q4">Qwen3 0.6B Q4_K_M (~530MB)</option>
            <option value="qwen3-1.7b-q4">Qwen3 1.7B Q4_K_M (~1.2GB)</option>
        </select>
        <button id="loadBtn" style="padding:4px 12px;font-size:0.7rem;">Load</button>
    </div>

    <div class="window-body">
        <div class="chat-area" id="chat">
            <div class="msg assistant">👋 Select a model and click Load. First load downloads the model, then it's cached in browser.</div>
        </div>

        <div class="input-area">
            <input type="text" id="input" placeholder="Type a message... (Enter to send)" disabled>
            <button id="sendBtn" disabled>Send</button>
        </div>

        <div class="status-bar">
            <div>
                <span class="status-dot loading" id="statusDot"></span>
                <span id="statusText">Not loaded</span>
            </div>
            <div class="progress" id="progress"></div>
        </div>

        <div class="console-log" id="consoleLog"></div>
    </div>
</div>

<script type="module">
    import { Wllama, LoggerWithoutDebug } from '/wllama/index.js';

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const progressEl = document.getElementById('progress');
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const loadBtn = document.getElementById('loadBtn');
    const modelSelect = document.getElementById('modelSelect');
    const consoleLog = document.getElementById('consoleLog');

    let wllama = null;
    let messages = [];
    let isLoading = false;

    function log(msg) {
        const line = document.createElement('div');
        line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        consoleLog.appendChild(line);
        consoleLog.classList.add('show');
        consoleLog.scrollTop = consoleLog.scrollHeight;
        console.log(msg);
    }

    const MODELS = {
        'qwen35-0.8b-q8': {
            repo: 'bartowski/Qwen_Qwen3.5-0.8B-GGUF',
            file: 'Qwen_Qwen3.5-0.8B-Q8_0.gguf',
            name: 'Qwen 3.5 0.8B Q8'
        },
        'qwen35-0.8b-q5': {
            repo: 'bartowski/Qwen_Qwen3.5-0.8B-GGUF',
            file: 'Qwen_Qwen3.5-0.8B-Q5_K_M.gguf',
            name: 'Qwen 3.5 0.8B Q5'
        },
        'qwen3-0.6b-q4': {
            repo: 'bartowski/Qwen3-0.6B-GGUF',
            file: 'Qwen3-0.6B-Q4_K_M.gguf',
            name: 'Qwen3 0.6B Q4'
        },
        'qwen3-1.7b-q4': {
            repo: 'bartowski/Qwen3-1.7B-GGUF',
            file: 'Qwen3-1.7B-Q4_K_M.gguf',
            name: 'Qwen3 1.7B Q4'
        }
    };

    function setStatus(state, text) {
        statusDot.className = 'status-dot ' + state;
        statusText.textContent = text;
    }

    function addMessage(role, content) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.textContent = content;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    async function loadModel() {
        if (isLoading) return;
        isLoading = true;
        loadBtn.disabled = true;
        const modelKey = modelSelect.value;
        const model = MODELS[modelKey];

        try {
            setStatus('loading', 'Downloading...');
            progressEl.textContent = 'Starting...';
            log('Loading model: ' + model.name);

            if (wllama) { await wllama.exit(); wllama = null; }

            wllama = new Wllama({
                default: '/wllama/wllama.wasm',
            }, {
                logger: LoggerWithoutDebug,
            });

            await wllama.loadModelFromHF(
                { repo: model.repo, file: model.file },
                {
                    progressCallback: ({ loaded, total }) => {
                        const pct = Math.round((loaded / total) * 100);
                        progressEl.textContent = `Downloading: ${pct}%`;
                        log(`Progress: ${pct}%`);
                    }
                }
            );

            messages = [];
            chat.innerHTML = '';
            addMessage('assistant', `✅ ${model.name} loaded! Running on CPU via WASM. Ask me anything.`);

            setStatus('ready', 'Ready');
            progressEl.textContent = '';
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
            log('Model loaded successfully');

        } catch (err) {
            console.error(err);
            log('ERROR: ' + err.message);
            setStatus('error', 'Error');
            progressEl.textContent = '';
            addMessage('assistant', '❌ Failed: ' + err.message);
        } finally {
            isLoading = false;
            loadBtn.disabled = false;
        }
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text || isLoading || !wllama) return;

        input.value = '';
        addMessage('user', text);
        messages.push({ role: 'user', content: text });

        const replyEl = addMessage('assistant', '');
        replyEl.classList.add('typing');

        try {
            const response = await wllama.createChatCompletion({
                messages: messages,
                max_tokens: 512,
                temperature: 0.7,
                top_k: 40,
                top_p: 0.9,
            });

            const text = response.choices[0].message.content;
            replyEl.textContent = text;
            replyEl.classList.remove('typing');
            messages.push({ role: 'assistant', content: text });
            log('Generated response');

        } catch (err) {
            replyEl.textContent = '❌ Error: ' + err.message;
            replyEl.classList.remove('typing');
            log('Generation error: ' + err.message);
        }
    }

    loadBtn.addEventListener('click', loadModel);
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    log('Page loaded. Select a model and click Load.');
</script>
</body>
</html>
