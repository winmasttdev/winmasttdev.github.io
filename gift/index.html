<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Короче, лови подарок 🎁</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Outfit:wght@300;400;600;800&family=Montserrat:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Table Container -->
    <div id="table-surface" class="table-surface">
        
        <!-- Ambient Shadows / Light effect -->
        <div class="table-overlay"></div>
        <div class="sun-glare"></div>

        <!-- Initial Envelope Container (Click to Open) -->
        <div id="envelope-wrapper" class="envelope-wrapper">
            <div class="envelope">
                <div class="envelope-flap"></div>
                <div class="envelope-body">
                    <div class="envelope-seal">💖</div>
                    <div class="envelope-front-text">Короче, лови...</div>
                </div>
            </div>
            <div class="envelope-hint">Жми сюда 💌</div>
        </div>

        <!-- Letter Card (Slides up when envelope is clicked) -->
        <div id="letter-card" class="letter-card hidden">
            <div class="letter-paper">
                <h1 class="letter-header">Короче, лови! 📸</h1>
                <p class="letter-text">
                    Спасибо тебе за все твои подарки, за то что дружишь со мной с детства и помогаешь мне когда надо.
                </p>
                <p class="letter-text">
                    Мне честно приятно с тобой общаться, судьба решила нас соеденить))
                </p>
                <div class="letter-signature">Твой друг</div>
            </div>
        </div>

        <!-- Polaroid Photos (Slide in from left & right when envelope is opened) -->
        <div id="photos-container" class="photos-container">
            <!-- Left Side Photos -->
            <div id="photo-1" class="polaroid-photo slide-from-left hidden" style="--rotation: -5deg;">
                <div class="polaroid-image-wrapper">
                    <img src="assets/IMG_20250902_085220.jpg" alt="Моменты детства 1">
                </div>
                <div class="polaroid-caption"></div>
            </div>
            
            <div id="photo-2" class="polaroid-photo slide-from-left hidden" style="--rotation: 4deg;">
                <div class="polaroid-image-wrapper">
                    <img src="assets/IMG_20250902_092338.jpg" alt="Моменты детства 2">
                </div>
                <div class="polaroid-caption"></div>
            </div>

            <!-- Right Side Photos -->
            <div id="photo-3" class="polaroid-photo slide-from-right hidden" style="--rotation: -3deg;">
                <div class="polaroid-image-wrapper">
                    <img src="assets/IMG_20250902_093119.jpg" alt="Моменты детства 3">
                </div>
                <div class="polaroid-caption"></div>
            </div>
            
            <div id="photo-4" class="polaroid-photo slide-from-right hidden" style="--rotation: 6deg;">
                <div class="polaroid-image-wrapper">
                    <img src="assets/IMG_20250902_094720.jpg" alt="Моменты детства 4">
                </div>
                <div class="polaroid-caption"></div>
            </div>
        </div>

        <!-- Walkman / Retro Cassette Player lying on the table -->
        <div id="retro-player" class="retro-player hidden">
            <div class="player-body">
                <div class="cassette-window">
                    <div class="cassette-wheels">
                        <div id="wheel-left" class="wheel"></div>
                        <div id="wheel-right" class="wheel"></div>
                    </div>
                    <div class="tape-indicator">OG Buda - откровения</div>
                </div>
                <div class="player-controls">
                    <button id="player-play-btn" class="player-btn" title="Воспроизвести / Пауза">
                        <svg viewBox="0 0 24 24" class="play-svg" width="16" height="16">
                            <path fill="currentColor" d="M8 5v14l11-7z"/>
                        </svg>
                        <svg viewBox="0 0 24 24" class="pause-svg hidden" width="16" height="16">
                            <path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>
                    <div class="player-volume-group">
                        <svg viewBox="0 0 24 24" width="12" height="12" class="vol-icon"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
                        <input type="range" id="player-volume" class="player-volume" min="0" max="1" step="0.05" value="0.8">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Lightbox Overlay for viewing photos full screen -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" src="" alt="">
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <!-- Audio Element -->
    <audio id="bg-audio" loop>
        <source src="assets/music/song.mp3" type="audio/mpeg">
        <source src="assets/music/song.wav" type="audio/wav">
    </audio>

    <!-- App JavaScript -->
    <script src="app.js"></script>
</body>
</html>
